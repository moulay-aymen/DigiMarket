{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4"><i class="bi bi-person-circle"></i> Gestion du Profil</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <h5 class="text-secondary mb-3">Informations de compte</h5>
                {{ user_form.as_p }}
                <hr class="my-4">
                <h5 class="text-secondary mb-3">Informations complémentaires</h5>
                {{ profile_form.as_p }}
                <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Mettre à jour le profil</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
