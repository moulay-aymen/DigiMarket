{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4">{{ action }} un produit numérique</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Enregistrer le produit</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'dashboard:vendor_dashboard' %}" class="text-decoration-none">Retour au tableau de bord</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
