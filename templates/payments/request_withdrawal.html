{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3 text-center"><i class="bi bi-cash-coin"></i> Demande de Retrait (RIP)</h3>
            <p class="text-muted text-center">Votre solde actuel : <strong class="text-success">{{ profile.balance }} DZD</strong></p>
            <p class="small text-muted text-center">Rappel : Montant minimum 500 DZD. Une demande tous les 14 jours.</p>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="amount" class="form-label">Montant du retrait (DZD)</label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Votre RIP enregistré</label>
                    <input type="text" class="form-control" value="{{ profile.rip }}" disabled>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Soumettre la demande de retrait</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
